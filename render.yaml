services:
  - type: web
    name: netsaver-gm
    runtime: static
    buildCommand: echo "static site, no build"
    staticPublishPath: .
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /config.js
        name: Cache-Control
        value: no-cache
      - path: /content.js
        name: Cache-Control
        value: no-cache
      - path: /i18n.js
        name: Cache-Control
        value: no-cache
